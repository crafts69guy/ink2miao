pre-commit:
  parallel: false
  commands:
    biome:
      glob: '*.{ts,js,json,jsonc}'
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.ts'
      run: bunx tsc --noEmit

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    coverage:
      run: bun run test:cov
